[unstable]
codegen-backend = true

[profile.dev]
codegen-backend = "cranelift"

# No sccache: this Cargo passes one -L path per crate. sccache starts rustc with the full
# command line, and Bevy crates exceed the Windows limit of 32767 characters (os error 206).

[profile.dev.package.poly1305]
codegen-backend = "llvm"
