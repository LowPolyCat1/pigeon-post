[package]
name = "pigeon-post"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

# Bevy breaks its API every release and plugins lag behind it.
# Every version is exact; docs/stack.md gives the upgrade rule.
[dependencies]
bevy = "=0.19.1"
avian3d = "=0.7.0"
bevy_replicon = "=0.44.2"
bevy_replicon_renet = { version = "=0.20.0", features = ["renet_steam"] }
# renet_steam 3.0.0 still pulls in steamworks 0.12.2, so the build holds both versions.
# docs/stack.md gives the risk.
steamworks = "=0.13.1"

[features]
# Builds Bevy as a shared library, so a rebuild relinks only the game code.
# Use it for development only: `cargo run --features dev`. A release build must not use it.
dev = ["bevy/dynamic_linking"]

# The voice spike uses these crates only in `examples/voice_loopback.rs`.
# cpal 0.17.3 is the version that Bevy audio already uses, so the build holds one cpal.
[dev-dependencies]
cpal = "=0.17.3"
opus = "=0.4.0"

[profile.dev]
opt-level = 0
incremental = true
codegen-units = 16
lto = false

[profile.dev.package."*"]
opt-level = 0
incremental = true
codegen-units = 16

[profile.release]
lto = "fat"
opt-level = 3
incremental = false
codegen-units = 1

[profile.release.package."*"]
opt-level = 3
incremental = false
codegen-units = 1
